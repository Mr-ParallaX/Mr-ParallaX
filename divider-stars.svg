<svg viewBox="0 0 1000 46" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="divBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="50%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b2fc9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e85d75" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b2fc9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="46" fill="url(#divBg)"/>

  <g fill="#ffffff">
    <circle cx="30" cy="12" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="30" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="15" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="34" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="10" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="28" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="14" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="32" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="9" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="27" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="16" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="33" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="965" cy="12" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="21" width="1000" height="3" fill="url(#beam)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
