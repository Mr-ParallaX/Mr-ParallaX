<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0326"/>
      <stop offset="100%" stop-color="#05010d"/>
    </radialGradient>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#radarBg)"/>

  <!-- radar rings -->
  <g transform="translate(180,110)" stroke="#4ade80" fill="none" opacity="0.55">
    <circle r="30"/>
    <circle r="60"/>
    <circle r="90"/>
    <line x1="-95" y1="0" x2="95" y2="0"/>
    <line x1="0" y1="-95" x2="0" y2="95"/>
  </g>

  <!-- rotating sweep -->
  <g transform="translate(180,110)">
    <path d="M 0 0 L 95 0 A 95 95 0 0 1 67 67 Z" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- blips -->
  <g fill="#f87171">
    <circle cx="220" cy="80" r="4"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="140" cy="150" r="4"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="240" cy="140" r="3.5"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="2.5s"/></circle>
  </g>
  <circle cx="180" cy="110" r="3" fill="#4ade80"/>

  <!-- scan text -->
  <g font-family="monospace" fill="#4ade80">
    <text x="330" y="60" font-size="15" opacity="0.9">$ threatmap --scan 185.62.xxx.xxx</text>
    <text x="330" y="88" font-size="13" opacity="0.6">resolving indicators of compromise...</text>
    <text x="330" y="112" font-size="13" opacity="0.6">cross-referencing OSINT feeds...</text>
    <text x="330" y="136" font-size="13" fill="#f87171" opacity="0.85">⚠ 3 active threat indicators found</text>
    <text x="330" y="160" font-size="13" opacity="0.6">building relationship graph...</text>
    <rect x="330" y="172" width="10" height="16" fill="#4ade80">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- twinkling background stars -->
  <g fill="#ffffff">
    <circle cx="900" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="80" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="150" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="190" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
