<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="45%" stop-color="#0f0326"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d5c"/>
      <stop offset="60%" stop-color="#e85d75"/>
      <stop offset="100%" stop-color="#8b2fc9"/>
    </radialGradient>
    <radialGradient id="moonShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f4f0ff"/>
      <stop offset="100%" stop-color="#b8a9dd"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd8ff"/>
      <stop offset="100%" stop-color="#2a6fb0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="200" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="120" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="190" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="55" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="130" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="70" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="220" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- distant moon top right -->
  <circle cx="900" cy="55" r="30" fill="url(#moonShade)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- glowing planet bottom left -->
  <circle cx="90" cy="210" r="46" fill="url(#planetGlow)">
    <animateTransform attributeName="transform" type="rotate" values="0 90 210;360 90 210" dur="40s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="90" cy="210" rx="70" ry="12" fill="none" stroke="#ffd9a0" stroke-width="2" opacity="0.6" transform="rotate(-18 90 210)"/>

  <!-- floating astronaut -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0" dur="4.5s" repeatCount="indefinite"/>
    <g transform="translate(500,120) rotate(-6)">
      <!-- backpack -->
      <rect x="-34" y="-30" width="26" height="60" rx="8" fill="#c7cbd6"/>
      <!-- body -->
      <ellipse cx="0" cy="10" rx="46" ry="54" fill="#f2f4f8"/>
      <ellipse cx="0" cy="10" rx="46" ry="54" fill="none" stroke="#a9b0c0" stroke-width="2"/>
      <!-- chest panel -->
      <rect x="-16" y="0" width="32" height="20" rx="4" fill="#e0536b"/>
      <circle cx="-8" cy="10" r="2.5" fill="#fff"/>
      <circle cx="0" cy="10" r="2.5" fill="#fff"/>
      <circle cx="8" cy="10" r="2.5" fill="#fff"/>
      <!-- arms -->
      <ellipse cx="-48" cy="-2" rx="14" ry="24" fill="#f2f4f8" stroke="#a9b0c0" stroke-width="2" transform="rotate(24 -48 -2)"/>
      <ellipse cx="48" cy="-10" rx="14" ry="24" fill="#f2f4f8" stroke="#a9b0c0" stroke-width="2" transform="rotate(-40 48 -10)"/>
      <!-- legs -->
      <ellipse cx="-18" cy="60" rx="15" ry="26" fill="#f2f4f8" stroke="#a9b0c0" stroke-width="2" transform="rotate(10 -18 60)"/>
      <ellipse cx="18" cy="62" rx="15" ry="26" fill="#f2f4f8" stroke="#a9b0c0" stroke-width="2" transform="rotate(-6 18 62)"/>
      <!-- helmet -->
      <circle cx="0" cy="-46" r="34" fill="#f2f4f8" stroke="#a9b0c0" stroke-width="2"/>
      <ellipse cx="4" cy="-46" rx="24" ry="22" fill="url(#visor)"/>
      <ellipse cx="-6" cy="-54" rx="7" ry="5" fill="#ffffff" opacity="0.7"/>
      <!-- tether -->
      <path d="M -34 0 C -90 20, -120 70, -150 60" fill="none" stroke="#e0536b" stroke-width="2.5" stroke-dasharray="4 5" opacity="0.8"/>
    </g>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="55" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="-60,-40; 1040,220" dur="5s" begin="0s;shoot.end+3.5s" id="shoot" fill="freeze" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.7;1" dur="5s" begin="0s;shoot.end+3.5s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
